name: tests
# Автоматичні запуски тимчасово вимкнено; тести доступні вручну в Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        database: [sqlite, mysql, pgsql]
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: nova_poshta_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nova_poshta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      NP_TEST_DB_DRIVER: ${{ matrix.database }}
      NP_TEST_DB_DATABASE: nova_poshta_test
      NP_TEST_DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd
          coverage: none
      - run: composer update --with "laravel/framework:^${{ matrix.laravel }}.0" --with "orchestra/testbench:^${{ matrix.laravel == '12' && '10' || '11' }}.0" --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
